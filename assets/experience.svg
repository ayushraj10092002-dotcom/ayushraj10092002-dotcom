<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="expBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1120;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="expGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glowExp">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#expBg)" />
  <rect x="40" y="30" width="1120" height="240" rx="20" fill="#0a1120" opacity="0.6" stroke="url(#expGlow)" stroke-width="2" filter="url(#glowExp)" />
  <text x="70" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#00d4ff" letter-spacing="1">PROFESSIONAL EXPERIENCE</text>
  <line x1="70" y1="82" x2="440" y2="82" stroke="#00d4ff" stroke-width="2" opacity="0.6" />
  <line x1="100" y1="120" x2="100" y2="230" stroke="#00d4ff" stroke-width="2" opacity="0.5" />
  <circle cx="100" cy="130" r="10" fill="#00d4ff" filter="url(#glowExp)" />
  <text x="150" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eafbff">Web Development Intern</text>
  <text x="150" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#00d4ff">InAmigos Foundation (IAF)</text>
  <text x="150" y="173" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8bb8ff">Sep 2026 – Present • Remote</text>
  <text x="150" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8bb8ff" opacity="0.8">Building responsive web solutions • Real-world project collaboration</text>
  <circle cx="100" cy="220" r="10" fill="#7c3aed" filter="url(#glowExp)" />
  <line x1="100" y1="140" x2="100" y2="210" stroke="#7c3aed" stroke-width="2" opacity="0.4" stroke-dasharray="5,5" />
  <text x="650" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eafbff">AI Intern</text>
  <text x="650" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#7c3aed">1M1B — 1 Million for 1 Billion</text>
  <text x="650" y="173" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8bb8ff">2026 • Applied AI &amp; Green Skills Initiative</text>
  <text x="650" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8bb8ff" opacity="0.8">Exploring practical AI applications • Sustainability focus</text>
