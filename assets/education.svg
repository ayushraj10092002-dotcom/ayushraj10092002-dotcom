<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1120;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eduGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glowEdu">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="240" fill="url(#eduBg)" />
  <rect x="40" y="30" width="1120" height="180" rx="20" fill="#0a1120" opacity="0.6" stroke="url(#eduGlow)" stroke-width="2" filter="url(#glowEdu)" />
  <circle cx="90" cy="100" r="32" fill="#0f1a2e" stroke="#00d4ff" stroke-width="2" opacity="0.7" />
  <text x="90" y="115" font-family="Arial" font-size="48" text-anchor="middle" fill="#00d4ff" opacity="0.8">🎓</text>
  <text x="150" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#eafbff">Meerut Institute of Engineering &amp; Technology</text>
  <text x="150" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#00d4ff">Bachelor of Technology — Computer Science &amp; Engineering</text>
  <text x="150" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8bb8ff">Duration: 2025–2029 • Current Semester: 3rd</text>
  <text x="150" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8bb8ff" opacity="0.8">Focus: AI/ML • DSA • Web Development • Software Engineering</text>
</svg>
